<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRS INSIGHT — Connecting the Insights of Sydney and Seoul</title>
  <meta name="description" content="TRS INSIGHT — Technology · Research · Strategy. Connecting the Insights of Sydney and Seoul.">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JQRMRNLJY5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JQRMRNLJY5');
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      background-image: url('bondi.png');
      background-size: cover;
      background-position: center 40%;
      background-repeat: no-repeat;
      z-index: 0;
      filter: brightness(1.12) saturate(1.3) contrast(1.05);
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
      z-index: 1;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      animation: fadeUp 1.4s ease both;
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2.8rem, 7vw, 6.2rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
      text-shadow:
        0 0 24px rgba(0,0,0,0.65),
        0 2px 12px rgba(0,0,0,0.5),
        0 1px 6px rgba(0,0,0,0.35);
    }

    .sub {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(0.78rem, 1.8vw, 1.08rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #ffffff;
      margin-top: 0.9em;
      text-shadow:
        0 0 20px rgba(0,0,0,0.9),
        0 2px 12px rgba(0,0,0,0.8),
        0 1px 4px rgba(0,0,0,0.6);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(255, 255, 255, 0.5);
      margin: 1.8em auto;
    }

    .slogan {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.82rem, 1.6vw, 1.02rem);
      letter-spacing: 0.07em;
      color: #ffffff;
      line-height: 1.7;
      text-shadow:
        0 0 20px rgba(0,0,0,0.9),
        0 2px 12px rgba(0,0,0,0.8),
        0 1px 4px rgba(0,0,0,0.6);
    }

    /* ─── MEMBER LOGIN BUTTON ─── */
    .member-cta {
      margin-top: 2.4em;
    }

    .member-btn {
      background: rgba(255, 255, 255, 0.50);
      border: 1px solid rgba(255, 255, 255, 0.70);
      color: #fff;
      padding: 12px 34px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.7rem, 1.1vw, 0.78rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-shadow:
        0 0 12px rgba(0,0,0,0.7),
        0 1px 4px rgba(0,0,0,0.5);
    }

    .member-btn:hover,
    .member-btn:focus-visible {
      background: rgba(255, 255, 255, 0.30);
      border-color: #fff;
      outline: none;
    }

    /* ─── BOTTOM BAR — single row ─── */
    .footer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      padding: 11px 32px;
      text-align: center;
      animation: fadeIn 2s ease both;
    }

    .footer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-location,
    .footer-email,
    .footer-copy {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.65rem, 1.2vw, 0.78rem);
      color: rgba(255, 255, 255, 0.88);
      text-decoration: none;
    }

    .footer-location {
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .footer-email {
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .footer-email:hover { color: #fff; }

    .footer-copy {
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .footer-sep {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 300;
      font-size: 0.75rem;
    }

    /* ─── MODAL ─── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 52px 60px 48px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      position: relative;
      transform: translateY(12px);
      transition: transform 0.35s ease;
      color: #fff;
    }

    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1;
      padding: 4px 8px;
    }

    .modal-close:hover,
    .modal-close:focus-visible {
      opacity: 1;
      outline: none;
    }

    .modal-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 12px;
      font-weight: 300;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .modal-note {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.75;
      margin-bottom: 32px;
    }

    .modal-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 12px 0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-align: center;
      outline: none;
      transition: border-color 0.25s;
      text-transform: uppercase;
    }

    .modal-input:focus { border-bottom-color: #fff; }

    .modal-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.2em;
    }

    .modal-guidance {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 20px;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .modal-guidance a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      text-decoration-color: rgba(255, 255, 255, 0.5);
    }

    .modal-guidance a:hover { text-decoration-color: #fff; }
    .modal-guidance.visible { opacity: 1; }

    .modal-btn {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #fff;
      padding: 12px 44px;
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      font-weight: 400;
    }

    .modal-btn:hover,
    .modal-btn:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      border-color: #fff;
      outline: none;
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__content, .footer-bar { animation: none; }
      .modal, .modal-backdrop { transition: none; }
    }

    /* ─── MOBILE ─── */
    @media (max-width: 600px) {
      body { overflow: auto; }

      .hero {
        height: 100svh;
        min-height: 560px;
        justify-content: flex-start;
        padding-top: 7vh;
      }

      /* No overlay — sky is bright enough for dark text */
      .hero__overlay {
        background: rgba(0, 0, 0, 0.0);
      }

      .hero__bg {
        background-position: 55% 30%;
      }

      /* Dark navy text for sky background */
      .brand {
        font-size: clamp(2.2rem, 11vw, 3rem);
        letter-spacing: 0.12em;
        color: #1b2a4a;
        text-shadow: none;
      }

      .sub {
        font-size: clamp(0.62rem, 3vw, 0.82rem);
        letter-spacing: 0.14em;
        color: #2c3e6b;
        text-shadow: none;
      }

      .divider {
        margin: 0.9em auto;
        background: rgba(27, 42, 74, 0.35);
      }

      .slogan {
        font-size: clamp(0.72rem, 3.2vw, 0.9rem);
        color: #2c3e6b;
        text-shadow: none;
      }

      /* Button on mobile — dark navy palette to match sky treatment */
      .member-cta {
        margin-top: 1.6em;
      }

      .member-btn {
        color: #1b2a4a;
        background: rgba(255, 255, 255, 0.35);
        border-color: rgba(27, 42, 74, 0.55);
        text-shadow: none;
        padding: 10px 26px;
        font-size: 0.68rem;
      }

      .member-btn:hover,
      .member-btn:focus-visible {
        background: rgba(255, 255, 255, 0.5);
        border-color: rgba(27, 42, 74, 0.8);
      }

      /* Footer: restore original transparency */
      .footer-bar {
        padding: 7px 18px;
        background: rgba(255, 255, 255, 0.10);
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }

      .footer-row {
        gap: 4px;
        row-gap: 2px;
      }

      .footer-location,
      .footer-email,
      .footer-copy {
        color: rgba(255, 255, 255, 0.88);
        font-size: 0.62rem;
      }

      .footer-sep {
        display: none;
      }

      .footer-copy {
        width: 100%;
        text-align: center;
        margin-top: 0px;
      }

      /* Modal on mobile */
      .modal { padding: 40px 28px 36px; }
      .modal-title { font-size: 22px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero__bg"></div>
    <div class="hero__overlay"></div>

    <div class="hero__content">
      <h1 class="brand">TRS INSIGHT</h1>
      <p class="sub">Technology&nbsp;·&nbsp;Research&nbsp;·&nbsp;Strategy</p>
      <div class="divider"></div>
      <p class="slogan">
        Connecting the Insights<br>of Sydney and Seoul
      </p>
      <div class="member-cta">
        <button class="member-btn" type="button" id="openLogin">Member Login</button>
      </div>
    </div>

    <footer class="footer-bar">
      <div class="footer-row">
        <span class="footer-location">Sydney&nbsp;·&nbsp;Seoul</span>
        <span class="footer-sep">|</span>
        <a class="footer-email" href="mailto:insight@trsinsight.com">insight@trsinsight.com</a>
        <span class="footer-sep">|</span>
        <span class="footer-copy">© 2026 TRS INSIGHT</span>
      </div>
    </footer>

  </section>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal">
      <button class="modal-close" type="button" aria-label="Close">&times;</button>
      <div class="modal-eyebrow">Enter Access Code</div>
      <h2 class="modal-title" id="modalTitle">Member Access</h2>
      <p class="modal-note">For members of the practice.</p>
      <input type="text" class="modal-input" id="modalInput" placeholder="Access Code" autocomplete="off" spellcheck="false" aria-label="Access code">
      <div class="modal-guidance" id="modalGuidance" role="status"></div>
      <button class="modal-btn" type="button" id="modalSubmit">Enter</button>
    </div>
  </div>

  <script>
    (function () {
      const modal = document.getElementById('modal');
      const modalInput = document.getElementById('modalInput');
      const modalGuidance = document.getElementById('modalGuidance');
      const modalSubmit = document.getElementById('modalSubmit');
      const modalClose = modal.querySelector('.modal-close');
      const openLogin = document.getElementById('openLogin');
      let lastFocused = null;

      function openModal() {
        lastFocused = document.activeElement;
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        setTimeout(() => modalInput.focus(), 300);
      }

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        modalInput.value = '';
        modalGuidance.classList.remove('visible');
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
      }

      function submitCode() {
        modalGuidance.innerHTML = 'Please contact <a href="mailto:insight@trsinsight.com">insight@trsinsight.com</a> for access.';
        modalGuidance.classList.add('visible');
        modalInput.value = '';
        modalInput.focus();
      }

      openLogin.addEventListener('click', openModal);
      modalClose.addEventListener('click', closeModal);
      modalSubmit.addEventListener('click', submitCode);

      modalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitCode();
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
      });
    })();
  </script>

</body>
</html>
